[package]
name = "xarxa-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Driver trait for the `xarxa` TCP/IP network stack."
documentation = "https://docs.rs/xarxa-driver/"
homepage = "https://github.com/embassy-rs/xarxa"
repository = "https://github.com/embassy-rs/xarxa.git"
readme = "README.md"
keywords = ["ip", "tcp", "udp", "ethernet", "network"]
categories = ["embedded", "network-programming"]
license = "0BSD"

[package.metadata.flux]
enabled = true

# `#[derive(defmt::Format)]` raises `possible out-of-bounds access` inside defmt's own
# formatting machinery, and one unpaid obligation here aborts the build before xarxa is
# ever reached -- which is why the firmware configuration had never been checked end to
# end. Trusting this crate cannot affect any xarxa result: it does not reference `xarxa::`
# at all, so nothing here can sit on a chain above an xarxa panic site.
#
# `include_trusted = ["def:..."]` would be the precise tool and does not work on these:
# the items are macro-expanded, and three patterns (`def:format`, `def:Format`,
# `def:CHECK`, plus `include_trusted_impl`) all left the six errors standing.
#
# The controls in `spec_is_live` carry `trusted(no)` so they stay CHECKED. A blanket
# `default_trusted` would otherwise silence the tripwire whose entire purpose is to fail
# loudly if the `consume` closure refinement regresses.
default_trusted = true

# `cfg(flux)` is injected by `cargo flux`; `cfg(flux_negative_control)` is set by
# hand to build the negative control in `spec_is_live`. Neither is ever set by a
# normal `cargo build`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(flux)',
    'cfg(flux_negative_control)',
] }

[dependencies]
defmt = { version = "1.0.1", optional = true }
flux-rs = { path = "../../flux/lib/flux-rs" }

[features]
defmt = ["dep:defmt"]

# Enable the `PacketMeta::id` field.
"packetmeta-id" = []
# Enable the `PacketMeta::timestamp` and `PacketMeta::request_timestamp` fields, and
# `Device::poll_tx_timestamp`.
#
# Transmit timestamps are correlated back to the packet that produced them by
# `PacketMeta::id`, so this requires `packetmeta-id`.
"packetmeta-timestamp" = ["packetmeta-id"]
