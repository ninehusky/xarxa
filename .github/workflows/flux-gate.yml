# NOT YET RUN IN GITHUB ACTIONS. Written from the local invocation that does
# work; the flux build/install step in particular is unverified in a runner.
# Expect to iterate on the first PR run.
#
# Fails only when a panic that was ALREADY removed has lost its justification --
# a `flux_rs::assert(false); unreachable_unchecked()` whose enclosing function
# cannot be proved, or whose exported precondition some caller cannot establish.
# The raw error count is deliberately NOT a gate: adding a correct refinement
# raises it, so gating on the total would block the branches doing the most real
# verification work.

name: flux soundness gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flux-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The driver every number in this repo was measured against, identified by
  # hashing ~/.flux/flux-driver and finding its byte-identical twin:
  #   ~/.flux/flux-driver  ==  flux-composed/target/release/flux-driver
  # (the `flux-composed/sysroot` copy is the DEBUG build and does not match).
  # Branch: ninehusky/flux hotfix/composed-2026-08-17. Pinned by SHA, not by
  # branch name, so the driver cannot move under us -- every count re-baselines
  # when it does, which makes bumping this a deliberate, reviewed change.
  FLUX_SHA: 71fef2717071c8fdb29fce819a4d5c0608f10089

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # xarxa's Cargo.toml carries `flux-rs = { path = "../flux/lib/flux-rs" }`,
      # so the two checkouts must be SIBLINGS. Checking xarxa out at the
      # workspace root would put `../flux` outside $GITHUB_WORKSPACE.
      - name: Check out xarxa
        uses: actions/checkout@v4
        with:
          path: xarxa
          # flux_audit creates a git worktree to measure; a depth-1 clone cannot
          # resolve an arbitrary ref.
          fetch-depth: 0

      - name: Check out flux
        uses: actions/checkout@v4
        with:
          repository: ninehusky/flux
          ref: ${{ env.FLUX_SHA }}
          path: flux

      # flux is a rustc driver: it needs the exact nightly it was built against,
      # plus rustc-dev/llvm-tools. Read from flux's own rust-toolchain.toml
      # rather than duplicated here, so the two cannot drift.
      - name: Install toolchain
        run: |
          set -euxo pipefail
          chan=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' flux/rust-toolchain.toml)
          rustup toolchain install "$chan" \
            --component rust-src --component rustc-dev --component llvm-tools

      - name: Cache flux build
        id: fluxcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-flux
            ~/.cargo/bin/flux
            ~/.flux
            flux/target
          # Keyed on the flux commit: rebuild only when the pinned driver moves.
          # Without this the rustc-driver build dominates the run.
          key: flux-${{ runner.os }}-${{ env.FLUX_SHA }}-v1

      - name: Build and install flux
        if: steps.fluxcache.outputs.cache-hit != 'true'
        working-directory: flux
        # `xtask install` hardcodes ~/.flux and `cargo install --force`s over
        # ~/.cargo/bin. That is destructive on a shared machine and must never be
        # run locally -- on a throwaway runner it is the right call. It defaults
        # to `--profile release`, which is what ~/.flux actually is.
        run: cargo xtask install

      - name: Put flux on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # flux shells out to `fixpoint` (liquid-fixpoint, a Haskell binary) to
      # discharge constraints. `cargo xtask install` does NOT provide it, and
      # without it every check dies with
      #   internal compiler error: failed to run fixpoint: No such file or directory
      # Reuse flux's own composite action from the sibling checkout, so the
      # download stays in sync with the pinned driver rather than drifting.
      - name: Install fixpoint
        uses: ./flux/.github/actions/install-fixpoint

      # fixpoint in turn shells out to z3 as its SMT solver. Without it every
      # check dies with
      #   fixpoint crash: z3: createProcess: posix_spawnp: does not exist
      # Version matters: the solver decides what is provable, so pin it to the
      # one the local numbers were taken against (4.16.0 here) rather than
      # whatever the runner happens to ship. flux's own CI notes that versions
      # older than ~4.15 hang.
      - name: Install z3
        uses: cda-tum/setup-z3@v1.6.6
        with:
          version: 4.16.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Appends its verdict to $GITHUB_STEP_SUMMARY, so the result is readable on
      # the run page without opening the log. Exits nonzero on an unjustified gate.
      - name: Gate
        working-directory: xarxa
        run: ./flux-gate.sh

      - name: Upload flux logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-logs
          path: /tmp/fluxaudit-*/
          if-no-files-found: ignore
